
name: Build and Release Stillnote

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Build macOS installer
        run: npx electron-builder --mac dmg zip --universal --publish never

      - name: Upload macOS installer
        uses: actions/upload-artifact@v6
        with:
          name: macos-installer
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: release/*.AppImage
          if-no-files-found: error

  build-linux-deb:
    name: Build Linux DEB
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Build Linux DEB
        run: npx electron-builder --linux deb --x64 --publish never

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: release/*.deb
          if-no-files-found: error

  publish-npm:
    name: Publish Package to Public npm
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
      - build-linux-appimage
      - build-linux-deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Update npm for Trusted Publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Publish to public npm
        run: npm publish --access public --registry=https://registry.npmjs.org/

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
      - build-linux-appimage
      - build-linux-deb
      - publish-npm

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Stillnote ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
